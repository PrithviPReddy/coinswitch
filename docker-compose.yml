# docker compose up --build  ->  http://localhost:3000
#
# Everything below reads from a .env file sitting next to this one. Copy
# .env.example to .env and fill it in first; `npm run setup:devnet` prints
# the three Solana values.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: coinswitch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d coinswitch"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies migrations once, then exits.
  migrate:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgresql://dev:devpassword@postgres:5432/coinswitch
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      # "postgres" is the compose service name. localhost here would resolve
      # to the app container itself and the connection would be refused.
      DATABASE_URL: postgresql://dev:devpassword@postgres:5432/coinswitch
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}

      JUP_API_KEY: ${JUP_API_KEY:-}
      MAINNET_RPC_URL: ${MAINNET_RPC_URL:-https://api.mainnet-beta.solana.com}
      DEVNET_RPC_URL: ${DEVNET_RPC_URL:-https://api.devnet.solana.com}

      DEVNET_USDC_MINT: ${DEVNET_USDC_MINT}
      DEVNET_USDT_MINT: ${DEVNET_USDT_MINT}
      DEVNET_JUP_MINT: ${DEVNET_JUP_MINT}
      DEVNET_BONK_MINT: ${DEVNET_BONK_MINT}
      DEVNET_WIF_MINT: ${DEVNET_WIF_MINT}
      FUND_TOKEN_USD: ${FUND_TOKEN_USD:-250000}
      VAULT_SECRET_KEY: ${VAULT_SECRET_KEY}

      DEMO_USERNAME: ${DEMO_USERNAME:-demo@coinswitch.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-review2}

      MAX_WALLETS_PER_USER: ${MAX_WALLETS_PER_USER:-5}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Records mainnet Jupiter quotes into QuoteSample and QuoteDrift for the cost
  # model. Read only: it holds no wallet key and signs nothing.
  #
  # Pause it for a live demo unless it has a key of its own, or the app's
  # quotes can be rate limited in front of an audience:
  #   npm run sampler:pause      (docker compose stop sampler)
  #   npm run sampler:resume     (docker compose start sampler)
  #
  # Blank knobs fall through to the defaults in scripts/sampler/index.mjs, so
  # this file never pins a stale ladder or cadence. SAMPLER_MAX_RPM is the
  # exception: it is written here so a restart cannot silently drop it.
  sampler:
    build:
      context: .
    command: ["node", "scripts/sampler/index.mjs"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dev:devpassword@postgres:5432/coinswitch
      # A dedicated key, when there is one, keeps the sampler off the app's
      # budget. Falls back to JUP_API_KEY.
      SAMPLER_JUP_API_KEY: ${SAMPLER_JUP_API_KEY:-}
      JUP_API_KEY: ${JUP_API_KEY:-}
      # Burst ceiling, not average load: a nine-rung ladder is fired at once
      # and needs nine of Jupiter's ten requests per 10 s window.
      SAMPLER_MAX_RPM: ${SAMPLER_MAX_RPM:-60}
      SAMPLER_INTERVAL_SECONDS: ${SAMPLER_INTERVAL_SECONDS:-}
      SAMPLER_DRIFT_EVERY: ${SAMPLER_DRIFT_EVERY:-}
      SAMPLER_DRIFT_DELAYS: ${SAMPLER_DRIFT_DELAYS:-}
      SAMPLER_DRIFT_RUNGS: ${SAMPLER_DRIFT_RUNGS:-}
      SAMPLER_DRIFT_LARGE_RUNG: ${SAMPLER_DRIFT_LARGE_RUNG:-}
      SAMPLER_DRIFT_LARGE_EVERY: ${SAMPLER_DRIFT_LARGE_EVERY:-}
      SAMPLER_LADDER_SOL: ${SAMPLER_LADDER_SOL:-}
      SAMPLER_LADDER_USD: ${SAMPLER_LADDER_USD:-}
      SAMPLER_SLIPPAGE_BPS: ${SAMPLER_SLIPPAGE_BPS:-}
      SAMPLER_LADDER_MAX_SPAN_SECONDS: ${SAMPLER_LADDER_MAX_SPAN_SECONDS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
